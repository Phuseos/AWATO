name: Build

# Every push and pull request is tested and built; the builds can be downloaded
# from the run's "Artifacts". Pushing a tag like v0.3.0 also publishes a release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: awato --check
      - run: pytest -q
        env:
          SDL_AUDIODRIVER: dummy

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: AWATO.exe
          - os: ubuntu-22.04  # Older glibc, so the build runs on older distros too
            file: AWATO.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: python scripts/build.py
      - name: Smoke test the packaged game
        shell: bash
        run: dist/${{ matrix.file }} --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/AWATO.exe dist/AWATO.sh
          --repo "$GITHUB_REPOSITORY"
          --title "A Week At The Office $GITHUB_REF_NAME"
          --generate-notes
