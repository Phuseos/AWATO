[project]
name = "awato"
version = "0.2.0"
description = "A Week At The Office: a narrative IT-management game for the terminal"
requires-python = ">=3.11"
dependencies = ["textual>=8.2", "pyyaml>=6.0", "pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
awato = "awato.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["awato", "awato.ui"]

[tool.setuptools.package-data]
"awato.ui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
